<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>YOU SHOULD NOT HAVE CLICKED | VACCITY</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 16px;
      display: grid;
      place-items: center;
      background: #050505;
      color: white;
      font-family: "DM Sans", sans-serif;
      text-align: center;
    }

    .scare-card {
      width: min(100%, 760px);
      animation: appear .25s ease-out both;
    }

    .warning {
      color: #ff3333;
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .2em;
    }

    h1 {
      margin: 12px 0 20px;
      color: #ff2929;
      font: 800 clamp(2rem, 7vw, 4rem)/1.05 "Outfit", sans-serif;
      text-shadow: 0 0 20px rgba(255,0,0,.4);
    }

    .momo-image {
      display: block;
      width: min(100%, 560px);
      max-height: 65vh;
      object-fit: contain;
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0 0 35px rgba(255,0,0,.25);
      animation: jumpscare .45s ease-out both;
    }

    .message {
      margin: 22px 0;
      color: #ddd;
      font-size: 1.1rem;
    }

    button, a {
      display: inline-block;
      margin: 7px;
      padding: 13px 20px;
      border: 0;
      border-radius: 10px;
      font: 800 .9rem "DM Sans", sans-serif;
      text-decoration: none;
      cursor: pointer;
    }

    .sound-button {
      color: white;
      background: #9b1717;
    }

    .back-button {
      color: #111;
      background: white;
    }

    @keyframes appear {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes jumpscare {
      0% { opacity: 0; transform: scale(.55); }
      65% { opacity: 1; transform: scale(1.06); }
      100% { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="scare-card">
    <div class="warning">⚠️ SECRET PAGE FOUND ⚠️</div>

    <h1>WHY DID YOU CLICK THAT?!</h1>

    <img
      class="momo-image"
      src="momo.jpg"
      alt="Momo jumpscare"
    >

    <p class="message">
      You were just supposed to learn about vaccines. 💀
    </p>

    <button class="sound-button" id="playScare" style="display:none;">
      🔊 PLAY SCARY SOUND
    </button>

    <br>

    <a class="back-button" href="index.html" data-vaccity-back>
      ESCAPE BACK TO VACCITY
    </a>
  </main>

  <audio id="scareAudio" src="momo-scare.m4a" preload="auto"></audio>

  <script>
    const scareAudio = document.getElementById("scareAudio");
    const playScare = document.getElementById("playScare");

    // Keep the jumpscare sound at a moderate volume.
    scareAudio.volume = 0.40;

    window.addEventListener("load", () => {
      scareAudio.play().catch(() => {
        playScare.style.display = "inline-block";
      });
    });

    playScare.addEventListener("click", () => {
      scareAudio.currentTime = 0;
      scareAudio.play();
      playScare.style.display = "none";
    });
  </script>

  <script>
    (() => {
      const backLink = document.querySelector("[data-vaccity-back]");
      if (!backLink) return;
      backLink.addEventListener("click", event => {
        const referrer = document.referrer;
        if (referrer && new URL(referrer).origin === window.location.origin && history.length > 1) {
          event.preventDefault();
          history.back();
        }
      });
    })();
  </script>

</body>
</html>
