<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102c50">
  <title>A Little VACCITY Surprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #102c50;
      --blue: #1769aa;
      --cyan: #46c6db;
      --page: #f3f8fc;
      --card: #ffffff;
      --ink: #18324d;
      --muted: #60758a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, rgba(70,198,219,.20), transparent 32%),
        radial-gradient(circle at 85% 85%, rgba(23,105,170,.14), transparent 34%),
        var(--page);
      font-family: "DM Sans", sans-serif;
    }

    .surprise-card {
      width: min(100%, 650px);
      padding: clamp(24px, 5vw, 46px);
      text-align: center;
      background: var(--card);
      border: 1px solid rgba(23,105,170,.14);
      border-radius: 28px;
      box-shadow: 0 22px 65px rgba(16,44,80,.13);
      animation: pop-in .65s cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      display: inline-block;
      padding: 8px 13px;
      border-radius: 999px;
      color: var(--blue);
      background: rgba(70,198,219,.16);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .09em;
    }

    h1 {
      margin: 20px 0 10px;
      color: var(--navy);
      font: 800 clamp(2rem, 7vw, 3.5rem)/1.05 "Outfit", sans-serif;
    }

    .subtitle {
      margin: 0 auto 24px;
      max-width: 470px;
      color: var(--muted);
      line-height: 1.65;
    }

    .portrait-wrap {
      width: min(100%, 440px);
      margin: 0 auto 22px;
      overflow: hidden;
      border-radius: 20px;
      background: #dceef5;
      box-shadow: 0 12px 30px rgba(16,44,80,.15);
    }

    .portrait-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    .song-title {
      margin: 10px 0 22px;
      color: var(--navy);
      font: 700 1.35rem "Outfit", sans-serif;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    a.button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 48px;
      padding: 13px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 800;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    a.button:hover { transform: translateY(-2px); }

    .primary {
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--navy));
      box-shadow: 0 8px 20px rgba(23,105,170,.23);
    }

    .secondary {
      color: var(--blue);
      background: rgba(70,198,219,.14);
    }

    .tiny-note {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: .78rem;
    }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(18px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }

    body.dark-mode {
      --page: #0b1726;
      --card: #13263b;
      --ink: #e8f2fb;
      --muted: #b0c2d3;
    }

    body.dark-mode h1,
    body.dark-mode .song-title { color: #f0f7ff; }

    body.dark-mode .surprise-card {
      border-color: rgba(70,198,219,.2);
      box-shadow: 0 22px 65px rgba(0,0,0,.3);
    }
  </style>
</head>
<body>
  <main class="surprise-card">
    <span class="eyebrow">🔎 SECRET DISCOVERED</span>
    <h1>YOU FOUND THE EASTER EGG!</h1>
    <p class="subtitle">
      You came here to learn about mRNA vaccines...
      but science has led you somewhere unexpected.
    </p>

    <p class="song-title">A little surprise is waiting for you... 👀</p>

    <audio id="rewardSound" src="achievement.m4a" preload="auto" autoplay></audio>
    <button id="playSound" class="button secondary" type="button" hidden>▶ Tap to play the surprise sound</button>

    <div class="actions">
      <a
        class="button primary"
        href="rickroll-video.html"
        target="_blank"
        rel="noopener noreferrer"
      >UNLOCK YOUR SURPRISE ↗</a>

      <a class="button secondary" href="index.html">Back to VACCITY</a>
    </div>

    <p class="tiny-note">VACCITY: where science meets unexpected surprises. 💙</p>
  </main>

  <script>
    try {
      if (localStorage.getItem("vaccity-theme") === "dark") {
        document.body.classList.add("dark-mode");
      }
    } catch (error) {}
  </script>
  <script>
    // Try to play the reward sound immediately when this page opens.
    const rewardSound = document.getElementById("rewardSound");
    const playSoundButton = document.getElementById("playSound");

    async function startRewardSound() {
      try {
        rewardSound.currentTime = 0;
        await rewardSound.play();
        playSoundButton.hidden = true;
      } catch (error) {
        // Browsers may require a visitor interaction before playing audio.
        playSoundButton.hidden = false;
      }
    }

    playSoundButton.addEventListener("click", startRewardSound);
    window.addEventListener("load", startRewardSound);
  </script>
</body>
</html>
